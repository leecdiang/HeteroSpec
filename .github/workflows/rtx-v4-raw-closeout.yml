name: RTX V4 sealed raw evidence closeout

on:
  push:
    branches:
      - audit/rtx-v4-raw-closeout-20261002
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtx-v4-raw-closeout
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Read audit source only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/audit/rtx_v4_raw_closeout.py
          sparse-checkout-cone-mode: false
      - name: Retrieve sealed capsules and independently replay on CPU
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/audit/rtx_v4_raw_closeout.py --output audit-output --scratch audit-scratch
      - name: Retain readable results and original phase manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rtx-v4-raw-closeout-${{ github.run_id }}
          path: |
            audit-output/*.json
            audit-output/*.log
            audit-output/indexes/*.json
          if-no-files-found: error
          retention-days: 30
