name: B570 prefill fixed-delivery review

on:
  push:
    branches:
      - audit/b570-prefill-review-20261004

permissions:
  contents: read

concurrency:
  group: b570-prefill-fixed-review
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Read audit source only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/audit/b570_prefill_review_20261004.py
          sparse-checkout-cone-mode: false
      - name: Verify fixed remote chunks, files and original raw captures on CPU
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/audit/b570_prefill_review_20261004.py
      - name: Retain audit receipts and raw subset for independent local review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b570-prefill-review-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
