name: RTX remote seal offline content audit
on:
  push:
    branches: [codex/rtx-reconstruction-v010-offline-audit]
    paths: [.github/workflows/rtx-seal-content-v010.yml]
permissions:
  contents: read
jobs:
  seal-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: de912fe446d5d1b0b5faae0d76a317a98bad7cc0
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /artifacts/rtx_target_verification_intervention_v1/PREDICTIONS.tar.gz
            /benchmarks/rtx_target_verification_intervention_v1/PREDICTION_TRANSPORT.json
          sparse-checkout-cone-mode: false
      - name: Hash exact remote seal and every transported member, no model calls
        run: |
          python - <<'PY'
          import hashlib,json,tarfile,pathlib
          p=pathlib.Path('artifacts/rtx_target_verification_intervention_v1/PREDICTIONS.tar.gz')
          b=p.read_bytes()
          h=hashlib.sha256(b).hexdigest()
          blob=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert h=='cc27b87e8b5dcff009c0d00e367b33f713a0d2ec882c5dc09b5b3068cf4e2fb2'
          assert blob=='c0269bf53ea8370b2810f360a1932c1d48c4d54b'
          rows={}
          with tarfile.open(p,'r:gz') as t:
              for m in t:
                  assert m.isfile()
                  d=t.extractfile(m).read()
                  rows[m.name]={'sha256':hashlib.sha256(d).hexdigest(),'bytes':len(d)}
          # Transport metadata was committed later; bind tar membership directly:
          assert len(rows)==522
          assert rows['benchmarks/rtx_target_verification_intervention_v1/PREDICTION_SEAL.json']['sha256']=='674f9d666f38a0251fca432202cfc8912081a85d15a4f27c98dd06706b3d5553'
          pathlib.Path('/tmp/REMOTE_SEALED_MEMBERS.json').write_text(json.dumps({'status':'PASS','commit':'de912fe446d5d1b0b5faae0d76a317a98bad7cc0','blob_sha':blob,'archive_sha256':h,'bytes':len(b),'files':rows,'scope':'remote content membership only; absolute process timing not authenticated'},indent=2))
          print('Remote seal hash/member audit PASS',len(rows))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rtx-v010-remote-seal-content-audit
          path: /tmp/REMOTE_SEALED_MEMBERS.json
          retention-days: 30
